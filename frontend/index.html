<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AskPDF — A powerful local RAG application. Chat with your PDF documents using Ollama. Private, secure, and runs entirely on your machine." />
    <meta name="theme-color" content="#0A0A0F" />
    <title>AskPDF — Local RAG Document Chat</title>
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        var t = localStorage.getItem('askpdf-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
